<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20width=%22512%22%20height=%22512%22%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22bg0%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%232F6BFF%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%230B1B3F%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id=%22c0%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%220%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%235BE3F7%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%231FC4E8%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id=%22w0%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%220%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23fff%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23E4EEFF%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%22512%22%20height=%22512%22%20rx=%22116%22%20fill=%22url(%23bg0)%22/%3E%3Crect%20width=%22512%22%20height=%22512%22%20rx=%22116%22%20fill=%22url(%23bg0)%22/%3E%3Cg%20transform=%22translate(-12%200)%22%3E%3Cpath%20d=%22M139%20145.0H317L291%20195.0H113z%22%20fill=%22url(%23w0)%22%20stroke=%22url(%23w0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M353%20145.0H431L405%20195.0H327z%22%20fill=%22url(%23c0)%22%20stroke=%22url(%23c0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M139%20231.0H239L213%20281.0H113z%22%20fill=%22url(%23c0)%22%20stroke=%22url(%23c0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M275%20231.0H431L405%20281.0H249z%22%20fill=%22url(%23w0)%22%20stroke=%22url(%23w0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M139%20317.0H317L291%20367.0H113z%22%20fill=%22url(%23w0)%22%20stroke=%22url(%23w0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3Cpath%20d=%22M353%20317.0H431L405%20367.0H327z%22%20fill=%22url(%23c0)%22%20stroke=%22url(%23c0)%22%20stroke-width=%2218%22%20stroke-linejoin=%22round%22/%3E%3C/g%3E%3C/svg%3E">

<title>Fleetline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500;1,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concept: banco di smistamento da autostazione. Cifre condensate da tabellone orari, righe sobrie.
   Verde "cartello autostradale" come unico accento; rosso e ambra riservati agli avvisi. */
:root{
  --bg:#EDF1F9; --surface:#FFFFFF; --surface-2:#F3F6FC; --line:#DCE3F2; --line-strong:#B6C3DE;
  --ink:#0E1A33; --ink-2:#43506C; --ink-3:#6F7C9B;
  --accent:#2557E8; --accent-ink:#FFFFFF; --accent-soft:#E1E9FF;
  --ok:#0B8A5A; --ok-soft:#DDF4E8; --cyan:#22D3EE;
  --danger:#B3261E; --danger-soft:#FBE4E1;
  --warn:#8F5200; --warn-soft:#FBECD2;
  --info:#2A5C9A; --info-soft:#E0EBF8;
  --shadow:0 1px 2px rgba(22,38,44,.08),0 8px 24px rgba(22,38,44,.08);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1226; --surface:#111B36; --surface-2:#16223F; --line:#24345A; --line-strong:#34497A;
    --ink:#E6ECFA; --ink-2:#A9B7D6; --ink-3:#8394BB; --accent:#5B8CFF; --accent-ink:#06122E; --accent-soft:#16295C;
    --ok:#4FD39B; --ok-soft:#10382B; --cyan:#22D3EE;
    --danger:#FF8F85; --danger-soft:#3B1B19;
    --warn:#F2B764; --warn-soft:#3B2A10;
    --info:#8BB8EE; --info-soft:#162B44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1226; --surface:#111B36; --surface-2:#16223F; --line:#24345A; --line-strong:#34497A;
  --ink:#E6ECFA; --ink-2:#A9B7D6; --ink-3:#8394BB; --accent:#5B8CFF; --accent-ink:#06122E; --accent-soft:#16295C;
  --ok:#4FD39B; --ok-soft:#10382B; --cyan:#22D3EE;
  --danger:#FF8F85; --danger-soft:#3B1B19;
  --warn:#F2B764; --warn-soft:#3B2A10;
  --info:#8BB8EE; --info-soft:#162B44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-block:10px 56px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* header */
.top{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-top:6px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.brand svg{width:30px;height:30px;color:var(--accent)}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 11px;font-weight:500;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;line-height:20px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.badge.danger{background:var(--danger);color:var(--surface)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.sync{margin-left:auto;padding-bottom:12px;color:var(--ink-3);font-size:12px;display:flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.local i{background:var(--warn)}
main{padding-top:20px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.banner span{color:var(--ink)}

/* buttons & fields */
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ico{padding:7px 9px}
.btn svg{width:16px;height:16px}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:4px 6px}
.bar{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1;min-width:160px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--ink-2);font-weight:500}
.field>span em{font-style:normal;color:var(--ink-3);font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],select,textarea{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;min-width:0;width:100%
}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink-2)}
.pick:hover{border-color:var(--line-strong)}
.pick.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* tabella servizi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto}
table.tbl{width:100%;min-width:1040px;border-collapse:separate;border-spacing:0}
.tbl th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.srow{cursor:pointer}
.tbl tr.srow:hover td{background:var(--surface-2)}
.tbl td.dayrow{background:var(--surface-2);font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.02em;padding:8px 12px;text-transform:capitalize}
.tbl td.dayrow span{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--ink-2);margin-left:12px;text-transform:none;letter-spacing:0}
.tm{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--ink-3);margin-top:4px}
.sub{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.price{white-space:nowrap}
.price small{display:block;color:var(--ink-3);font-size:12px}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:5px}
.ex{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--info);background:var(--info-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.empty{border-style:dashed;background:transparent;color:var(--ink-3)}
.chip svg{width:13px;height:13px}
.stack{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.loading{padding:60px 20px;text-align:center;color:var(--ink-2)}
.msgs{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.msgs li{display:flex;gap:6px;align-items:flex-start}
.msgs li svg{width:14px;height:14px;flex:none;margin-top:2px}
.msgs .danger{color:var(--danger)}
.msgs .warn{color:var(--warn)}

/* assegnazione */
.presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}.fcohint{color:var(--ink-3);font-size:12px}
.hotelcard textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.daynav{display:flex;gap:6px;align-items:center}
.daynav input{font:inherit;padding:5px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.daychips{margin-bottom:10px;flex-wrap:wrap}
.cnt{margin-left:6px;font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.cnt.open{background:var(--warn-soft);color:var(--warn)}
.dayhead{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap;margin:4px 0 8px}
.dayhead h2{font-family:var(--f-display);font-size:24px;font-weight:600;margin:0;text-transform:capitalize}
.dayhead span{color:var(--ink-2);font-size:13.5px}
.wcount{color:var(--warn)}
.pairbar .hint{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.alayout2{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:1150px){.alayout2{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.at{width:100%;border-collapse:collapse;font-size:14px}
.at th{position:sticky;top:0;text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
.at td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.at th.num,.at td.num{text-align:right;font-variant-numeric:tabular-nums}
.at tr.ar td:first-child{border-left:4px solid transparent}
.at tr.paired td:first-child{border-left-color:hsl(var(--h) 55% 48%)}
.at tr.paired{background:color-mix(in srgb,hsl(var(--h) 55% 50%) 7%,var(--surface))}
.at tr.picked{background:var(--accent-soft)}
.at tr.on{outline:2px solid var(--accent);outline-offset:-2px}
.at td[data-action]{cursor:pointer}
.at tr:hover td[data-action]{text-decoration:underline;text-decoration-color:var(--line-strong)}
.c-ck{width:26px}.c-ck input{width:17px;height:17px;accent-color:var(--accent)}
.c-tm{font-family:var(--f-mono);font-weight:600;font-size:15px;white-space:nowrap}
.c-h{min-width:150px;max-width:230px}
.c-g{min-width:130px}.c-s{min-width:200px}
.c-w{min-width:120px}
.accb{border:0;border-radius:6px;min-width:26px;height:26px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 42%);cursor:pointer}
.rsel{font:inherit;font-size:13.5px;max-width:190px;padding:5px 6px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.rsel.empty{border-style:dashed;color:var(--ink-3)}
.rsel.ok{border-color:var(--accent)}
.rsel.warn{border-color:var(--warn);background:var(--warn-soft)}
.rsel.danger{border-color:var(--danger);background:var(--danger-soft)}
.side{display:flex;flex-direction:column;gap:12px}
.side .card{padding:12px 14px}
.side h3{margin:0 0 8px;font-family:var(--f-display);font-size:17px;font-weight:600}
.rl{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.rl li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.rl .nm{font-weight:600}.rl .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.rl .st{margin-left:auto;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
.rl li.free .st{color:var(--accent)}
.alayout{display:grid;grid-template-columns:minmax(340px,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:1000px){.alayout{grid-template-columns:minmax(0,1fr)}}
.col-h{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.col-h h2{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.02em}
.col-h span{color:var(--ink-2);font-size:13px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-size:16px;font-weight:700;margin-right:8px;vertical-align:2px}
.pairbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;margin-bottom:10px;box-shadow:var(--shadow)}
.pairbar b{font-variant-numeric:tabular-nums}
.dayh{font-family:var(--f-display);font-size:17px;font-weight:600;padding:12px 4px 6px;text-transform:capitalize;color:var(--ink-2)}
.arow{display:grid;grid-template-columns:22px 54px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.arow:hover{border-color:var(--line-strong)}
.arow.picked{border-color:var(--accent);background:var(--accent-soft)}
.arow.paired{cursor:pointer;background:var(--surface-2)}
.arow.paired.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.arow input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.arow .tm{font-size:21px}
.arow b{font-weight:600}
.arow .sub{margin-top:1px}
.accs{display:flex;flex-direction:column;gap:12px}
.acc{overflow:hidden;border-left:5px solid var(--line-strong)}
.acc.lvl-danger{border-left-color:var(--danger)}
.acc.lvl-warn{border-left-color:var(--warn)}
.acc.lvl-ok{border-left-color:var(--accent)}
.acc.sel{box-shadow:0 0 0 2px var(--accent)}
.acc-head{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.acc-n{font-family:var(--f-display);font-size:22px;font-weight:700;width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.acc-title{font-weight:600;overflow-wrap:anywhere}
.acc-meta{color:var(--ink-2);font-size:12.5px}
.acc-svcs{list-style:none;margin:0;padding:0 14px 8px}
.acc-svcs li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.acc-svcs .tm{font-size:18px}
.acc-body{padding:0 14px 14px}
.acc-foot{display:flex;justify-content:space-between;gap:8px;padding:0 14px 12px}
.pk-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:1250px){.pk-cols{grid-template-columns:minmax(0,1fr)}}
.pk-cols h4{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.opt:hover{border-color:var(--line-strong);background:var(--surface-2)}
.opt .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px}
.opt.lvl-warn .dot{background:var(--warn)}
.opt.lvl-danger .dot{background:var(--danger)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-weight:600}
.opt small{color:var(--ink-2)}
.opt .msgs{margin-top:4px}
.opt-tag{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.opt.on .opt-tag{color:var(--accent)}
.opt.lvl-danger:not(.on) .opt-tag{color:var(--danger)}
.opt.lvl-warn:not(.on) .opt-tag{color:var(--warn)}

/* riposi */

<script>
/*LOGIC-START*/
const DEFAULTS = { maxOre: 15, riposoOre: 9, maxGiorni: 7, riposoLungoOre: 45, oreCitta: 1.5, oreHtlFco: 2, oreFcoHtl: 3, oreFull: 8, oreHalf: 3, tolleranzaFco: 45, minSosta: 10, minPerKm: 3.5, minFco: 60, minCia: 45, minPorto: 120, oreTour: 10, attesaMaxOre: 0, sogliaPiccoli: 7, avvSovrapp: 0, avvPosti: 1, ivaPct: 10 };
const pad = n => String(n).padStart(2, '0');
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const numDay = n => { const t = new Date(n * 86400000); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); };
const hmin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const absMin = (d, t) => dayNum(d) * 1440 + hmin(t);
const clock = a => { const md = ((a % 1440) + 1440) % 1440; return pad(Math.floor(md / 60)) + ':' + pad(md % 60); };
const dateOf = a => numDay(Math.floor(a / 1440));
const dm = a => { const d = dateOf(a); return d.slice(8) + '/' + d.slice(5, 7); };
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return r ? h + 'h' + pad(r) : h + 'h'; };

// Nessuna ora di fine: la durata si stima dal tipo di servizio.
//  Htl x Fco (partenza) 2h · Fco x Htl (arrivo) 3h · transfer in città 2h · full/half day: ore scritte nel servizio o nelle note
//  tour fuori Roma: già organizzati, contano solo dall'orario di inizio.
const APT = '(?:fco|fiumicino|cia|ciampino)';
function kindOf(s) {
  const t = String(s.servizio || '');
  if (new RegExp('^\\s*' + APT + '[^x]*\\bx\\s*htl', 'i').test(t)) return 'arr';
  if (new RegExp('^\\s*htl\\s*x\\s*' + APT + '\\b', 'i').test(t)) return 'dep';
  if (/full\s*-?\s*day/i.test(t)) return 'full';
  if (/half\s*-?\s*day/i.test(t)) return 'half';
  return s.citta ? 'citta' : 'fuori';
}
function hoursIn(s) {
  for (const t of [s.servizio, s.note, s.altreNote]) { const m = String(t || '').match(/(\d+(?:[.,]\d+)?)\s*ore\b/i); if (m) return parseFloat(m[1].replace(',', '.')); }
  return null;
}
// Civitavecchia: da Roma un bus ci mette `minPorto` minuti a tratta. Se il servizio parte dal porto conta il viaggio verso Roma (più Fiumicino se «x Htl x Fco»);
// se parte da un hotel e va al porto contano andata e ritorno.
function portoOre(s, set) {
  const t = String(s.servizio || ''), tratta = (set.minPorto ?? 120) / 60;
  if (/^\s*(civitavecchia|porto)/i.test(t)) return tratta + (/x\s*htl\s*x\s*(fco|fiumicino|cia|ciampino)/i.test(t) ? set.oreHtlFco : 0);
  return tratta * 2;
}
function spanOf(s, set) {
  const start = absMin(s.data, s.ora), k = kindOf(s);
  const porto = /civitavecchia/i.test(String(s.servizio || '')) && k === 'citta';
  const h = porto && hoursIn(s) == null ? portoOre(s, set) : k === 'dep' ? set.oreHtlFco : k === 'arr' ? set.oreFcoHtl : k === 'citta' ? (hoursIn(s) ?? set.oreCitta) : k === 'full' ? (hoursIn(s) ?? set.oreFull) : k === 'half' ? (hoursIn(s) ?? set.oreHalf) : 0;
  let end = start + Math.round(h * 60);
  // le cene durano fino a tardi: almeno fino a mezzanotte, nessun servizio attaccato prima
  if (k !== 'fuori' && /\bcen[ae]\b/i.test(String(s.servizio || ''))) end = Math.max(end, absMin(s.data, '00:00') + 1440);
  return { start, end, est: h > 0 || end > start, kind: k };
}
const clk = it => (it.sp.end > it.sp.start ? clock(it.sp.start) + '–' + clock(it.sp.end) : clock(it.sp.start));
const descr = it => `${it.s.gruppo || 'servizio'} (${dm(it.sp.start)} ${clk(it)})`;
const prep = (list, set) => list.map(s => ({ s, sp: spanOf(s, set) })).sort((a, b) => a.sp.start - b.sp.start || a.sp.end - b.sp.end);
// b parte dopo a nell'ordinamento. Una partenza Htl x Fco seguita da un arrivo Fco x Htl si può accoppiare anche
// se l'arrivo cade fino a 45 minuti prima della fine della partenza: i clienti escono tardi dall'aeroporto.
const clash = (a, b, set) => {
  const tol = a.sp.kind === 'dep' && b.sp.kind === 'arr' ? (set.tolleranzaFco || 0) : 0;
  return tol ? b.sp.start + tol < a.sp.end : (b.sp.start < a.sp.end || b.sp.start === a.sp.start);
};

function pairs(items, fn, set) {
  for (let i = 0; i < items.length; i++)
    for (let j = i + 1; j < items.length && (items[j].sp.start < items[i].sp.end || items[j].sp.start === items[i].sp.start); j++)
      if (clash(items[i], items[j], set)) fn(items[i], items[j]);
}

const MINI_MAX = 30; // fino a 30 posti = minibus, se il tipo non è indicato
const isMini = b => !!b && (b.tipo ? b.tipo === 'minibus' : (Number(b.posti) || 0) > 0 && Number(b.posti) <= MINI_MAX);
const busLabel = b => b ? (isMini(b) ? 'Minibus' : 'Pullman') + (b.posti ? ' ' + b.posti + ' posti' : '') : '';
function busWarnings(list, bus, set) {
  const out = [];
  if (!bus) return out;
  const items = prep(list, set);
  if (bus.posti) for (const it of items) if (Number(it.s.pax) > Number(bus.posti))
    out.push({ svc: it.s.id, key: 'posti:' + it.s.id, level: 'danger', type: 'posti', text: `Posti insufficienti: ${it.s.pax} persone, ${bus.nome} (${isMini(bus) ? 'minibus' : 'pullman'}) ha ${bus.posti} posti` });
  if (set.avvSovrapp) pairs(items, (a, b) => {
    out.push({ svc: a.s.id, key: `ovb:${a.s.id}:${b.s.id}`, level: 'danger', type: 'ovb', text: `${bus.nome} è già impegnato: ${descr(b)}` });
    out.push({ svc: b.s.id, key: `ovb:${b.s.id}:${a.s.id}`, level: 'danger', type: 'ovb', text: `${bus.nome} è già impegnato: ${descr(a)}` });
  }, set);
  return out;
}

function driverAnalysis(list, drv, set) {
  const out = [], days = new Map();
  if (!drv) return { out, days };
  const nm = drv.nome;
  const it = prep(list, set);
  if (set.avvSovrapp) pairs(it, (a, b) => {
    out.push({ svc: a.s.id, key: `ovd:${a.s.id}:${b.s.id}`, level: 'danger', type: 'ovd', text: `${nm} è già impegnato: ${descr(b)}` });
    out.push({ svc: b.s.id, key: `ovd:${b.s.id}:${a.s.id}`, level: 'danger', type: 'ovd', text: `${nm} è già impegnato: ${descr(a)}` });
  }, set);
  const groups = new Map();
  for (const x of it) { if (!groups.has(x.s.data)) groups.set(x.s.data, []); groups.get(x.s.data).push(x); }
  const dates = [...groups.keys()].sort();
  // massimo ore nella giornata: dal primo inizio alla fine dell'ultimo servizio
  for (const k of dates) {
    const g = groups.get(k);
    const first = Math.min(...g.map(x => x.sp.start)), last = Math.max(...g.map(x => x.sp.end));
    days.set(k, { first, last, count: g.length, ids: g.map(x => x.s.id), restBefore: null, prevEnd: null, streak: 0 });
    if (last - first > set.maxOre * 60) {
      const est = g.some(x => x.sp.end === last && x.sp.est);
      for (const x of g) out.push({ svc: x.s.id, key: 'h:' + x.s.id, level: 'warn', type: 'h15',
        text: `${nm} lavorerebbe ${dur(last - first)} il ${dm(first)} (dalle ${clock(first)} alle ${clock(last)}${est ? ', fine stimata' : ''}): massimo ${set.maxOre}h` });
    }
  }
  // riposo minimo tra una giornata e la successiva
  let prevEnd = -Infinity, prevIt = null;
  for (const k of dates) {
    const g = groups.get(k);
    const firstIt = g.reduce((a, b) => (b.sp.start < a.sp.start ? b : a));
    if (prevIt) {
      const gap = firstIt.sp.start - prevEnd;
      days.get(k).restBefore = gap; days.get(k).prevEnd = prevEnd;
      if (gap < set.riposoOre * 60) {
        out.push({ svc: firstIt.s.id, key: `r:${prevIt.s.id}:${firstIt.s.id}`, level: 'warn', type: 'rest',
          text: `${nm} avrebbe solo ${dur(gap)} di riposo dal servizio precedente, ${descr(prevIt)}: minimo ${set.riposoOre}h` });
        out.push({ svc: prevIt.s.id, key: `r2:${prevIt.s.id}:${firstIt.s.id}`, level: 'warn', type: 'rest',
          text: `Dopo questo servizio ${nm} avrebbe solo ${dur(gap)} di riposo prima di ${descr(firstIt)}: minimo ${set.riposoOre}h` });
      }
    }
    for (const x of g) if (x.sp.end > prevEnd) { prevEnd = x.sp.end; prevIt = x; }
  }
  // giorni consecutivi e riposo lungo
  let streak = [], lastEnd = -Infinity, lastIt = null;
  for (const x of it) {
    const sd = Math.floor(x.sp.start / 1440), ed = Math.max(sd, Math.floor((x.sp.end - 1) / 1440));
    if (streak.length) {
      const gap = x.sp.start - lastEnd, lastDay = streak[streak.length - 1];
      if (gap >= set.riposoLungoOre * 60) streak = [];
      else if (sd > lastDay + 1) {
        if (streak.length >= set.maxGiorni) {
          out.push({ svc: x.s.id, key: 'g45:' + x.s.id, level: 'warn', type: 'streak',
            text: `Dopo ${streak.length} giorni consecutivi ${nm} ha bisogno di ${set.riposoLungoOre}h di riposo dalla fine dell'ultimo servizio (${descr(lastIt)}): ne avrebbe ${dur(gap)}` });
          out.push({ svc: lastIt.s.id, key: `g45b:${lastIt.s.id}:${x.s.id}`, level: 'warn', type: 'streak',
            text: `Dopo ${streak.length} giorni consecutivi ${nm} ha bisogno di ${set.riposoLungoOre}h di riposo da questo servizio, ma ${descr(x)} inizia dopo ${dur(gap)}` });
        }
        streak = [];
      }
    }
    for (let d = sd; d <= ed; d++) if (!streak.includes(d)) streak.push(d);
    const di = days.get(x.s.data); if (di) di.streak = Math.max(di.streak, streak.length);
    if (streak.length > set.maxGiorni)
      out.push({ svc: x.s.id, key: 'g:' + x.s.id, level: 'warn', type: 'streak',
        text: `${nm} sarebbe al ${streak.length}° giorno consecutivo di lavoro (massimo ${set.maxGiorni}): poi servono ${set.riposoLungoOre}h di riposo` });
    if (x.sp.end > lastEnd) { lastEnd = x.sp.end; lastIt = x; }
  }
  return { out, days };
}
const driverWarnings = (list, drv, set) => driverAnalysis(list, drv, set).out;

function groupBy(arr, f) { const m = new Map(); for (const x of arr) { const k = x[f]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }

// servizi "effettivi": ognuno porta pullman e autista del proprio accoppiamento (busId, driverId, accId, accN)
function analyze(servizi, pullman, autisti, set) {
  const W = new Map();
  const push = w => { if (!W.has(w.svc)) W.set(w.svc, []); W.get(w.svc).push(w); };
  for (const [id, list] of groupBy(servizi.filter(s => s.accId), 'accId')) if (list.length > 1 && set.avvSovrapp)
    pairs(prep(list, set), (a, b) => {
      push({ svc: a.s.id, key: `ovs:${a.s.id}:${b.s.id}`, level: 'danger', type: 'ovs', text: `Nello stesso accoppiamento c'è un servizio sovrapposto: ${descr(b)}` });
      push({ svc: b.s.id, key: `ovs:${b.s.id}:${a.s.id}`, level: 'danger', type: 'ovs', text: `Nello stesso accoppiamento c'è un servizio sovrapposto: ${descr(a)}` });
    }, set);
  for (const [id, list] of groupBy(servizi.filter(s => s.busId), 'busId')) busWarnings(list, pullman.find(b => b.id === id), set).forEach(push);
  for (const [id, list] of groupBy(servizi.filter(s => s.driverId), 'driverId')) driverWarnings(list, autisti.find(d => d.id === id), set).forEach(push);
  return W;
}

// Cosa succederebbe assegnando la risorsa a tutti i servizi di un accoppiamento (solo avvisi nuovi)
function whatIf(servizi, pullman, autisti, set, group, kind, resId) {
  const field = kind === 'bus' ? 'busId' : 'driverId';
  const res = (kind === 'bus' ? pullman : autisti).find(r => r.id === resId);
  const fn = kind === 'bus' ? busWarnings : driverWarnings;
  const ids = new Set(group.map(g => g.id));
  const others = servizi.filter(x => x[field] === resId && !ids.has(x.id));
  const before = new Set(fn(others, res, set).map(w => w.key));
  const after = fn([...others, ...group.map(g => ({ ...g, [field]: resId }))], res, set);
  const seen = new Set();
  return after.filter(w => !before.has(w.key)).filter(w => (seen.has(w.text) ? false : (seen.add(w.text), true)));
}

// ---- accoppiamento automatico -------------------------------------------------------------
// Obiettivo: meno pullman (= meno accoppiamenti) possibile. I servizi si mettono in fila per orario e durata,
// anche con numeri di persone diversi. Regole:
//  - i tour fuori Roma restano fuori (sono già organizzati);
//  - i servizi piccoli (fino a `sogliaPiccoli` persone) non vanno mai su un pullman: il blocco che li contiene va su un minibus;
//  - un blocco non supera `maxOre` ore di lavoro; il pullman deve avere i posti per il servizio più numeroso;
//  - nessuna sovrapposizione (con la tolleranza partenza Htl x Fco + arrivo Fco x Htl).
// Non dipende dai flag degli avvisi. I tour fuori Roma già assegnati a mano occupano il mezzo per `oreTour` ore.
function autoSpan(s, set) { const sp = spanOf(s, set); if (sp.kind === 'fuori') sp.end = sp.start + Math.round((set.oreTour || 10) * 60); return sp; }
// ---- spostamenti: dal punto dove finisce un servizio a quello dove parte il successivo (stime, regolabili in Avvisi) ----
const ROMA = [41.9, 12.49];
const CAP_LL = { '00184': [41.895, 12.497], '00185': [41.893, 12.508], '00186': [41.898, 12.476], '00187': [41.903, 12.488], '00192': [41.909, 12.463], '00193': [41.906, 12.46], '00195': [41.918, 12.46], '00196': [41.915, 12.47],
  '00197': [41.922, 12.488], '00198': [41.922, 12.5], '00199': [41.93, 12.52], '00153': [41.884, 12.47], '00154': [41.873, 12.48], '00183': [41.886, 12.51], '00182': [41.876, 12.52], '00181': [41.875, 12.53], '00179': [41.86, 12.53],
  '00165': [41.897, 12.44], '00167': [41.9, 12.42], '00152': [41.88, 12.45], '00145': [41.83, 12.48], '00144': [41.83, 12.47], '00142': [41.83, 12.49], '00191': [41.95, 12.47], '00135': [41.95, 12.42], '00136': [41.93, 12.43],
  '00161': [41.915, 12.515], '00162': [41.92, 12.525], '00100': ROMA, '00118': ROMA };
const llOf = s => CAP_LL[((String(s.hotelInd || '').match(/\b00\d{3}\b/) || [])[0])] || ROMA;
const kmBetween = (p, q) => { const R = 6371, r = Math.PI / 180, dLa = (q[0] - p[0]) * r, dLo = (q[1] - p[1]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(p[0] * r) * Math.cos(q[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const airCode = s => (/\b(cia|ciampino)\b/i.test(String(s.servizio || '')) ? 'cia' : 'fco');
function placeStart(s, k) { // dove parte il servizio
  const t = String(s.servizio || '');
  if (k === 'arr') return { t: 'air', code: airCode(s) };
  if (/^\s*(civitavecchia|porto)/i.test(t)) return { t: 'porto' };
  if (/^\s*htl\b/i.test(t)) return { t: 'hotel', name: String(s.hotel || '').trim().toLowerCase(), ll: llOf(s) };
  return { t: 'centro', ll: ROMA };
}
function placeEnd(s, k) { // dove si libera il mezzo (le durate stimate includono già l'andata e il rientro)
  const t = String(s.servizio || '');
  if (k === 'dep') return { t: 'centro', ll: ROMA };
  if (k === 'arr' || k === 'full' || k === 'half' || /\bx\s*htl\s*$/i.test(t)) return { t: 'hotel', name: String(s.hotel || '').trim().toLowerCase(), ll: llOf(s) };
  return { t: 'centro', ll: ROMA };
}
function travelMin(a, b, set) { // minuti per andare dalla fine di a all'inizio di b
  if (a.sp.kind === 'dep' && b.sp.kind === 'arr') return 0; // il pullman è già all'aeroporto: vale la tolleranza
  const e = placeEnd(a.s, a.sp.kind), st = placeStart(b.s, b.sp.kind), sosta = set.minSosta ?? 10;
  if (st.t === 'air') return st.code === 'cia' ? (set.minCia ?? 45) : (set.minFco ?? 60);
  if (st.t === 'porto') return set.minPorto ?? 90;
  if (e.t === 'hotel' && st.t === 'hotel' && e.name && e.name === st.name) return sosta;
  return Math.round(sosta + kmBetween(e.ll, st.ll) * (set.minPerKm ?? 3.5));
}
const compatIt = (a, b, set) => b.sp.start + (a.sp.kind === 'dep' && b.sp.kind === 'arr' ? (set.tolleranzaFco || 0) : 0) >= a.sp.end + travelMin(a, b, set); // b dopo a, con il tempo per raggiungere il punto di partenza
const freeOf = (x, y, set) => (x.sp.start <= y.sp.start ? compatIt(x, y, set) : compatIt(y, x, set));

function autoPlan(servizi, pullman, autisti, set, opts) {
  const day = opts.day, redo = !!opts.redo, small = Number(set.sogliaPiccoli) || 0;
  const miniSeats = pullman.filter(isMini).map(b => Number(b.posti) || 0), maxMini = miniSeats.length ? Math.max(...miniSeats) : 0;
  const isSmall = s => (Number(s.pax) || 0) <= small;
  const dayS = servizi.filter(s => s.data === day);
  const mine = s => redo || !s.accId;
  const skipped = [];
  const items = dayS.filter(s => {
    if (!mine(s)) return false;
    if (s.vettore) { skipped.push({ s, why: `Lo fa un vettore esterno (${s.vettore})` }); return false; }
    if (kindOf(s) === 'fuori') { skipped.push({ s, why: 'Tour fuori Roma: già organizzato' }); return false; }
    return true;
  }).sort((a, b) => a.ora.localeCompare(b.ora));
  const itemIds = new Set(items.map(s => s.id));
  const skipIds = new Set(skipped.map(x => x.s.id));
  const keep = servizi.filter(s => !itemIds.has(s.id) && !(redo && s.data === day && mine(s) && skipIds.has(s.id)));
  const seats = pullman.map(b => Number(b.posti) || Infinity), maxSeats = seats.length ? Math.max(...seats) : Infinity;
  const cap = set.attesaMaxOre > 0 ? set.attesaMaxOre * 60 : Infinity;
  // 1) catene: ogni servizio entra nella catena compatibile "migliore"; si apre una catena nuova solo se non c'è posto
  const chains = [];
  for (const s of items) {
    const it = { s, sp: autoSpan(s, set) }, pax = Number(s.pax) || 0, sm = isSmall(s);
    let best = null, bs = Infinity;
    for (const c of chains) {
      if ((c.small || sm) && Math.max(c.maxPax, pax) > maxMini) continue; // con un servizio piccolo il blocco sta su un minibus
      const last = c.items[c.items.length - 1];
      if (!compatIt(last, it, set)) continue;
      if (it.sp.end - c.items[0].sp.start > set.maxOre * 60) continue;
      const gap = it.sp.start - last.sp.end;
      if (gap > cap) continue;
      if (Math.max(c.maxPax, pax) > maxSeats) continue;
      let sc = Math.max(gap, 0);
      if (last.s.hotel && last.s.hotel === s.hotel) sc -= 90;
      if (last.sp.kind === 'dep' && it.sp.kind === 'arr') sc -= 90;
      if (sc < bs) { bs = sc; best = c; }
    }
    if (best) { best.items.push(it); best.maxPax = Math.max(best.maxPax, pax); best.small = best.small || sm; }
    else chains.push({ items: [it], maxPax: pax, small: sm });
  }
  // 2) pullman e autista
  const use = { bus: new Map(), drv: new Map() };
  const addUse = (kind, id, its) => { if (!use[kind].has(id)) use[kind].set(id, []); use[kind].get(id).push(...its); };
  for (const s of keep) { const sp = { s, sp: autoSpan(s, set) }; if (s.busId) addUse('bus', s.busId, [sp]); if (s.driverId) addUse('drv', s.driverId, [sp]); }
  const clear = (list, its) => !(list || []).some(x => its.some(y => !freeOf(x, y, set)));
  const dayLoad = id => (use.drv.get(id) || []).filter(x => x.s.data === day).reduce((m, x) => m + (x.sp.end - x.sp.start), 0);
  const usedBus = new Set(), usedDrv = new Set();
  const busFor = c => pullman.filter(b => (!c.small || isMini(b)) && (Number(b.posti) || Infinity) >= c.maxPax && clear(use.bus.get(b.id), c.items))
    .sort((a, b) => ((Number(a.posti) || Infinity) - (Number(b.posti) || Infinity)) || (usedBus.has(b.id) ? -1 : 0) - (usedBus.has(a.id) ? -1 : 0) || a.nome.localeCompare(b.nome, 'it'));
  const done = [];
  const queue = chains.slice().sort((a, b) => b.maxPax - a.maxPax || a.items[0].sp.start - b.items[0].sp.start);
  while (queue.length) {
    const c = queue.shift();
    {
      let bc = busFor(c);
      if (!bc.length && c.items.length > 1) { // nessun mezzo libero per tutto il blocco: stacco il servizio più numeroso (a parità l'ultimo) e riprovo
        let k = 0; c.items.forEach((it, i) => { if ((Number(it.s.pax) || 0) >= (Number(c.items[k].s.pax) || 0)) k = i; });
        const [out] = c.items.splice(k, 1);
        c.maxPax = Math.max(...c.items.map(i => Number(i.s.pax) || 0)); c.small = c.items.some(i => isSmall(i.s));
        queue.push({ items: [out], maxPax: Number(out.s.pax) || 0, small: isSmall(out.s) });
        queue.sort((x, y) => y.maxPax - x.maxPax); queue.unshift(c);
        continue;
      }
      c.busId = bc.length ? bc[0].id : null;
      c.noBus = !bc.length ? (c.small ? `Servizio fino a ${small} persone: serve un minibus con ${c.maxPax} posti, nessuno libero` : c.maxPax > maxSeats ? `Nessun mezzo con ${c.maxPax} posti` : 'Nessun mezzo libero con posti sufficienti') : '';
    }
    const group = c.items.map(i => i.s);
    const cands = autisti.filter(d => clear(use.drv.get(d.id), c.items)).map(d => {
      const mineList = (use.drv.get(d.id) || []).map(x => x.s), before = new Set(driverWarnings(mineList, d, set).map(w => w.key));
      const after = driverWarnings([...mineList, ...group], d, set), ws = after.filter(w => !before.has(w.key));
      const seen = new Set(), texts = ws.map(w => w.text).filter(t => !seen.has(t) && seen.add(t));
      return { d, texts, n: texts.length, load: dayLoad(d.id) };
    }).sort((a, b) => a.n - b.n || a.load - b.load || a.d.nome.localeCompare(b.d.nome, 'it'));
    if (cands.length) { c.driverId = cands[0].d.id; c.warns = cands[0].texts; } else { c.driverId = null; c.warns = []; c.noDriver = 'Nessun autista libero'; }
    if (c.busId) { addUse('bus', c.busId, c.items); usedBus.add(c.busId); }
    if (c.driverId) { addUse('drv', c.driverId, c.items); usedDrv.add(c.driverId); }
    done.push(c);
  }
  // 3) numeri Acc. (da 1, saltando quelli dei blocchi che restano)
  const taken = new Set(dayS.filter(s => s.accId && !itemIds.has(s.id)).map(s => s.accN)); // numeri dei blocchi che restano (anche di servizi esclusi dalla proposta)
  let n = 0;
  const out = done.slice().sort((a, b) => a.items[0].sp.start - b.items[0].sp.start).map(c => {
    do n++; while (taken.has(n));
    const its = c.items.slice().sort((a, b) => a.sp.start - b.sp.start);
    return { n, ids: its.map(i => i.s.id), busId: c.busId, driverId: c.driverId, maxPax: c.maxPax, small: !!c.small, start: its[0].sp.start, end: Math.max(...its.map(i => i.sp.end)),
      warns: c.warns, noBus: c.noBus || '', noDriver: c.noDriver || '',
      airport: its.some((x, i) => i && its[i - 1].sp.kind === 'dep' && x.sp.kind === 'arr') };
  });
  const big = out;
  return { day, redo, chains: out, skipped, stats: { services: items.length, blocks: out.length, bigBlocks: big.length, smallBlocks: out.length - big.length, buses: usedBus.size, minibus: [...usedBus].filter(id => isMini(pullman.find(b => b.id === id))).length, drivers: usedDrv.size, noBus: out.filter(c => !c.busId).length, noDriver: out.filter(c => !c.driverId).length } };
}
/*LOGIC-END*/

function mergeDupAcc() {
  const groups = new Map();
  for (const a of S.accoppiamenti) { const sv = S.servizi.find(x => x.accId === a.id); if (!sv) continue; const k = sv.data + '|' + a.n; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); }
  let n = 0;
  for (const list of groups.values()) {
    if (list.length < 2) continue;
    const score = a => (a.driverId ? 2 : 0) + (a.busId ? 1 : 0);
    list.sort((x, y) => score(y) - score(x));
    let keep = list[0];
    for (const a of list.slice(1)) {
      S.servizi.filter(x => x.accId === a.id).forEach(x => put('servizi', { ...x, accId: keep.id }, true));
      if ((!keep.busId && a.busId) || (!keep.driverId && a.driverId)) { keep = { ...keep, busId: keep.busId || a.busId || null, driverId: keep.driverId || a.driverId || null }; put('accoppiamenti', keep, true); }
      del('accoppiamenti', a.id, true); n++;
    }
  }
  return n;
}

const dayAccs = day => S.accoppiamenti.filter(a => S.eff.some(x => x.accId === a.id && x.data === day));

function setAcc(svcId, raw) { // numero Acc. scritto a mano: stesso numero nello stesso giorno = stesso accoppiamento

}
const ACC_MAX = 50;
const accCell = s => {
  const use = new Map(); dayAccs(s.data).forEach(a => use.set(a.n, S.eff.filter(x => x.accId === a.id && x.data === s.data).length));

};

function driverLine(a, day) { // ore di lavoro e riposo dell'autista in quel giorno

}
function vAssegna() {

  const f = S.fa, q = f.q.trim().toLowerCase(), day = f.day || todayStr();
  const all = S.eff.filter(s => s.data === day).sort(byTime);
  const nm = (r, id) => { const x = r(id); return x ? x.nome : '￿'; };
  const CMP = {

  const nUn = all.filter(s => !s.accId && !s.vettore).length, nOpen = all.filter(s => !s.vettore && !(s.busId && s.driverId)).length, nW = all.filter(s => warnsOf(s).length).length;

  const bn = u => (bus(u.busId) || {}).nome || '\uffff', dn = u => (drv(u.driverId) || {}).nome || '\uffff', L = (x, y) => String(x).localeCompare(String(y), 'it');

/* --- Riposi --- */
function vRiposi() {
  const set = cfg(), { from, n } = S.rv, t = todayStr();
  const dates = [...Array(n)].map((_, i) => numDay(dayNum(from) + i));
  if (!S.autisti.length) return `<div class="card empty"><h3>Nessun autista</h3><p>Aggiungi gli autisti per vedere i loro riposi giorno per giorno.</p><button class="btn primary" data-action="tab" data-tab="risorse">Vai a Pullman e autisti</button></div>`;
  const DT = ['ovd', 'h15', 'rest', 'streak'];
  let body = '';
  for (const d of S.autisti.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'it'))) {
    const mine = S.eff.filter(s => s.driverId === d.id);
    const { days } = driverAnalysis(mine, d, set), spans = prep(mine, set);
    const lastEndBefore = abs => spans.reduce((m, x) => (x.sp.start < abs ? Math.max(m, x.sp.end) : m), -Infinity);
    let worked = 0, nw = 0, cells = '';
    for (const dt of dates) {
      const di = days.get(dt), abs = dayNum(dt) * 1440;
      if (di) {
        worked++;
        const ws = di.ids.flatMap(id => (S.W.get(id) || []).filter(w => DT.includes(w.type)));
        nw += ws.length ? 1 : 0;
        const lvl = ws.length ? worst(ws) : 'ok', uniq = [...new Set(ws.map(w => w.text))];
        const restBad = di.restBefore !== null && di.restBefore < set.riposoOre * 60;
        const t1 = di.last > di.first ? `${clock(di.first)}–${clock(di.last)}` : clock(di.first);
        cells += `<td><button class="rc ${lvl === 'ok' ? '' : 'lvl-' + lvl}" data-action="go-svc" data-id="${di.ids[0]}" ${uniq.length ? `title="${esc(uniq.join('\n'))}"` : ''}>
          <span class="t">${t1}</span>
          <span class="l">${di.count} serviz${di.count === 1 ? 'io' : 'i'}${di.last > di.first ? ' · ' + dur(di.last - di.first) : ''}</span>
          <span class="l ${restBad ? 'bad' : ''}">${di.restBefore === null ? 'primo servizio' : 'riposo prima: ' + dur(di.restBefore)}</span>
          <span class="l ${di.streak > set.maxGiorni ? 'bad' : ''}">${di.streak > 1 ? di.streak + '° giorno di fila' : '1° giorno'}</span></button></td>`;
      } else {
        const e = lastEndBefore(abs);
        if (e === -Infinity) cells += `<td><div class="rc none"><span class="t">Libero</span></div></td>`;
        else cells += `<td><div class="rc free"><span class="t">Riposo</span>${e >= abs - 1440 ? `<span class="l">dalle ${clock(e)} del ${dm(e)}</span>` : ''}</div></td>`;
      }
    }
    body += `<tr><th class="who" scope="row"><b>${esc(d.nome)}</b>${exTag(d)}<small>${worked} giorn${worked === 1 ? 'o' : 'i'} di lavoro${nw ? ` · <span style="color:var(--warn)">${nw} con avvisi</span>` : ''}</small></th>${cells}</tr>`;
  }
  const head = dates.map(dt => `<th class="${dt === t ? 'today' : ''}">${esc(dlabel(dt, { weekday: 'short', day: 'numeric' }))}<small>${esc(dlabel(dt, { month: 'short' }))}</small></th>`).join('');
  return `<div class="bar">
      <button class="btn ico" data-action="rv-move" data-d="-${n}" aria-label="Periodo precedente">${I.l}</button>
      <button class="btn ico" data-action="rv-move" data-d="${n}" aria-label="Periodo successivo">${I.r}</button>
      <button class="btn" data-action="rv-today">Oggi</button>
      <label class="field"><span>Dal</span><input type="date" id="rv-from" data-change="rvfrom" value="${from}"></label>
      <label class="field"><span>Giorni</span><select id="rv-n" data-change="rvn">${[7, 14, 21, 28].map(x => `<option value="${x}" ${x === n ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    </div>
    <div class="card rv-wrap"><table class="rvt"><thead><tr><th class="who">Autista</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i style="background:var(--surface-2)"></i>Giorno di lavoro</span><span><i style="background:var(--accent-soft)"></i>Riposo</span><span><i style="background:var(--warn-soft)"></i>Regola non rispettata (riposo sotto ${set.riposoOre}h, oltre ${set.maxOre}h, oltre ${set.maxGiorni} giorni o meno di ${set.riposoLungoOre}h dopo ${set.maxGiorni} giorni)</span><span>Il riposo è contato dalla fine dell'ultimo servizio all'inizio del primo servizio successivo. Clicca un giorno per aprire il servizio.</span></div>`;
}

function render() {
  const bl = document.getElementById('brandlogo'); if (bl && !bl.firstChild) bl.outerHTML = LOGO_SVG('logo', 'hg0');
  const ae = document.activeElement, keep = ae && ae.id && $app.contains(ae) ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const y = window.scrollY, t = todayStr();
  for (const b of document.querySelectorAll('#nav button')) b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false');
  const nAv = S.eff.filter(s => s.data >= t).reduce((a, s) => a + warnsOf(s).length, 0);
  const nUn = S.eff.filter(s => s.data >= t && stato(s) !== 'ok').length;
  const setB = (id, n) => { const e = document.getElementById(id); e.hidden = !n; e.textContent = n; };
  setB('b-avvisi', nAv); setB('b-assegna', nUn);
  const sy = document.getElementById('sync');
  sy.className = 'sync' + (S.mode === 'local' ? ' local' : '');
  sy.innerHTML = S.mode === 'db' ? '<i></i>Salvataggio online attivo' : (S.mode === 'local' ? '<i></i>Dati solo su questo browser' : '');
  if (!S.ready) { $app.innerHTML = '<div class="loading">Caricamento dei dati…</div>'; return; }
  const hasEx = [...S.servizi, ...S.pullman, ...S.autisti].some(x => x.esempio);
  const banner = hasEx ? `<div class="banner"><span>Stai vedendo dati di esempio per provare il gestionale.</span><button class="btn sm" data-action="del-examples">Elimina i dati di esempio</button></div>` : '';
  $app.innerHTML = banner + ({ servizi: vServizi, assegna: vAssegna, auto: vAuto, riposi: vRiposi, fatturato: vFatturato, avvisi: vAvvisi, risorse: vRisorse }[S.tab])();
  window.scrollTo(0, y);
  if (keep) { const e = document.getElementById(keep.id); if (e) { e.focus(); try { if (keep.a != null) e.setSelectionRange(keep.a, keep.b); } catch (x) {} } }
}

const $drawer = document.getElementById('drawer'), $scrim = document.getElementById('scrim'), $dbody = document.getElementById('dbody'), $dfoot = document.getElementById('dfoot');
let lastFocus = null;
function openDrawer(title, body, foot) {
  lastFocus = document.activeElement;
  document.getElementById('dtitle').textContent = title; $dbody.innerHTML = body; $dfoot.innerHTML = foot;
  $drawer.hidden = false; $scrim.hidden = false;
  const first = $dbody.querySelector('input:not([type=hidden]),select,textarea'); if (first) first.focus();
}
function closeDrawer() { $drawer.hidden = true; $scrim.hidden = true; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
const num = id => val(id) === '' ? '' : parseFloat(val(id));

function hotelMap() { // elenco di base + hotel importati + hotel già usati nei servizi
  const m = new Map(HOTEL_BASE.map(([n, a]) => [n, a]));

  S.servizi.forEach(x => { if (x.hotel && !m.has(x.hotel)) m.set(x.hotel, x.hotelInd || ''); });
  return m;
}

function saveServizio(isNew, id) {
  const err = m => { document.getElementById('ferr').textContent = m; };
  const o = { data: val('f-data'), ora: val('f-ora'), citta: document.getElementById('f-citta').checked, cliente: val('f-cliente'), gruppo: val('f-gruppo'), pax: parseInt(val('f-pax'), 10), ass: val('f-ass'), servizio: val('f-servizio'), hotel: val('f-hotel'), hotelInd: val('f-hotelInd'), volo: isFcoHtl(val('f-servizio')) ? val('f-volo') : '', prezzo: num('f-prezzo'), iva: document.querySelector('input[name=iva]:checked').value, spese: num('f-spese'), pasti: num('f-pasti'), vettore: val('f-vettore'), costoVett: num('f-costoVett'), incasso: document.getElementById('f-incasso').checked, ztlTipo: val('f-ztlTipo'), ztlOk: document.getElementById('f-ztlOk').checked, ztl: val('f-ztl'), note: val('f-note'), altreNote: val('f-altreNote'), noteForn: val('f-noteForn') };
  if (!o.data) return err('Inserisci la data.');
  if (!o.ora) return err('Inserisci l\'ora.');
  if (!o.gruppo) return err('Inserisci il riferimento del gruppo.');
  if (!(o.pax >= 1)) return err('Inserisci il numero di persone.');
  const ex = id ? S.servizi.find(x => x.id === id) : null;
  const rec = ex ? { ...ex, ...o } : { id: newId('s_'), accId: null, ...o };
  delete rec.oraFine; delete rec.busId; delete rec.driverId; // campi del vecchio modello
  persist('servizi', rec);
  if (isNew) { toast('Servizio salvato. Puoi inserirne un altro.'); openServizio(null, { data: o.data, iva: o.iva }); }
  else closeDrawer();
}

const RF = { pullman: [['nome', 'Nome', 'text', 'Es. Pullman 1'], ['targa', 'Targa', 'text'], ['posti', 'Posti a sedere', 'number'], ['note', 'Note', 'text']], autisti: [['nome', 'Nome e cognome', 'text'], ['telefono', 'Telefono', 'tel'], ['note', 'Note', 'text', 'Patente, disponibilità…']] };
function openRisorsa(kind, id) {
  const ex = id ? S[kind].find(x => x.id === id) : null, v = ex || {};
  const body = RF[kind].map(([k, l, t, ph]) => `<label class="field"><span>${l}</span><input type="${t}" id="r-${k}" value="${esc(v[k])}" ${t === 'number' ? 'min="1" inputmode="numeric"' : ''} placeholder="${esc(ph || '')}" autocomplete="off"></label>`).join('') + '<div class="ferr" id="ferr" role="alert"></div>';
  const body2 = kind === 'pullman' ? `<label class="field"><span>Tipo</span><select id="r-tipo"><option value="pullman" ${ex && !isMini(ex) || !ex ? 'selected' : ''}>Pullman</option><option value="minibus" ${ex && isMini(ex) ? 'selected' : ''}>Minibus</option></select></label><div class="chips">${[8, 16, 20, 30].map(n => `<button type="button" class="btn sm" data-action="mini-preset" data-n="${n}">Minibus ${n} posti</button>`).join('')}</div>` : '';
  const foot = `<button class="btn primary" data-action="save-r" data-kind="${kind}" data-id="${id || ''}">Salva</button>${ex ? `<button class="btn danger sp" data-action="del-r" data-kind="${kind}" data-id="${id}">Elimina</button>` : ''}`;
  openDrawer((ex ? 'Modifica ' : 'Nuovo ') + (kind === 'pullman' ? 'mezzo' : 'autista'), body2 + body, foot);
}
function saveRisorsa(kind, id) {
  const o = {}; for (const [k, , t] of RF[kind]) o[k] = t === 'number' ? (val('r-' + k) === '' ? '' : parseInt(val('r-' + k), 10)) : val('r-' + k);
  if (kind === 'pullman') o.tipo = val('r-tipo') === 'minibus' ? 'minibus' : 'pullman';
  if (!o.nome) { document.getElementById('ferr').textContent = 'Inserisci il nome.'; return; }
  if (kind === 'pullman' && !(o.posti >= 1)) { document.getElementById('ferr').textContent = 'Inserisci i posti: servono al controllo della capienza.'; return; }
  const ex = id ? S[kind].find(x => x.id === id) : null;
  persist(kind, ex ? { ...ex, ...o } : { id: newId(kind === 'pullman' ? 'b_' : 'd_'), ...o });
  closeDrawer();
}
function armDelete(el, fn) {
  if (el.dataset.armed) { fn(); return; }
  el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = 'Conferma eliminazione';
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.classList.remove('armed'); el.textContent = 'Elimina'; } }, 3500);
}

/* ---------- azioni ---------- */
const rawSvc = id => S.servizi.find(x => x.id === id);
const ACTIONS = {
  'mini-preset'(el) { const n = el.dataset.n; document.getElementById('r-tipo').value = 'minibus'; document.getElementById('r-posti').value = n; const nm = document.getElementById('r-nome'); if (!nm.value) nm.value = 'Minibus ' + n; },
  tab(el) { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  'new-s'() { openServizio(null, { data: S.tab === 'assegna' ? S.fa.day : (S.tab === 'auto' ? S.auto.day : todayStr()) }); },
  'edit-s'(el) { openServizio(el.dataset.id); },
  'save-s'(el) { saveServizio(!!el.dataset.new, el.dataset.id || null); },
  'dup-s'(el) { const s = rawSvc(el.dataset.id); if (s) { const { id, accId, esempio, ...rest } = s; openServizio(null, rest); } },
  'del-s'(el) { armDelete(el, () => { del('servizi', el.dataset.id, true); closeDrawer(); pruneAcc(); toast('Servizio eliminato.'); }); },
  'close-drawer'() { closeDrawer(); },
  'go-svc'(el) {
    const s = S.eff.find(x => x.id === el.dataset.id); if (!s) return;
    S.tab = 'assegna';
    S.fa.day = s.data; S.fa.q = ''; S.fa.mostra = 'tutti'; render(); window.scrollTo(0, 0);
  },
  'pick-res'(el) { if (POP && POP.svc === el.dataset.svc && POP.kind === el.dataset.kind) closePop(); else openPop(el); },
  'pop-set'(el) { if (!POP) return; const { svc, kind } = POP; closePop(); assignTo(svc, kind, el.dataset.id); },
  'auto-day'(el) { S.auto.day = el.dataset.set || numDay(dayNum(S.auto.day) + Number(el.dataset.d)); render(); },
  'auto-run'() { S.auto.plan = autoPlan(S.eff, S.pullman, S.autisti, cfg(), { day: S.auto.day, redo: S.auto.redo }); render(); },
  'auto-discard'() { S.auto.plan = null; render(); },
  'auto-apply'() {
    const P = S.auto.plan; if (!P || !P.chains.length) return;
    for (const c of P.chains) {
      const a = { id: newId('a_'), n: c.n, busId: c.busId || null, driverId: c.driverId || null };
      put('accoppiamenti', a, true);
      c.ids.forEach(id => { const sv = rawSvc(id); if (sv) put('servizi', { ...sv, accId: a.id }, true); });
    }
    pruneAcc(); recompute(); S.auto.plan = null; S.fa.day = P.day; S.fa.q = ''; S.fa.mostra = 'tutti'; S.tab = 'assegna'; render(); window.scrollTo(0, 0);
    toast(`${P.chains.length} accoppiamenti creati: li trovi in Assegnazione.`);
  },
  'fat-year'(el) { S.fat.year = (S.fat.year || new Date().getFullYear()) + Number(el.dataset.d); S.fat.month = ''; render(); },
  'fat-month'(el) { S.fat.month = el.dataset.m; if (el.dataset.m) S.fat.year = Number(el.dataset.m.slice(0, 4)); render(); window.scrollTo(0, 0); },
  'fat-day'(el) { S.fa.day = el.dataset.day; S.fa.q = ''; S.fa.mostra = 'tutti'; S.tab = 'assegna'; render(); window.scrollTo(0, 0); },
  'sv-day'(el) { S.sv.day = el.dataset.set || numDay(dayNum(svDay()) + Number(el.dataset.d)); render(); },
  'toggle-past'() { S.svPast = !S.svPast; render(); },
  'fa-day'(el) { S.fa.day = el.dataset.set || numDay(dayNum(S.fa.day) + Number(el.dataset.d)); render(); },
  'acc-new'(el) { const sv = rawSvc(el.dataset.id); if (!sv) return; const a = { id: newId('a_'), n: nextAccN(sv.data), busId: null, driverId: null }; put('accoppiamenti', a, true); put('servizi', { ...sv, accId: a.id }, true); recompute(); render(); },
  'unpair-svc'(el) { const s = rawSvc(el.dataset.id); if (!s) return; put('servizi', { ...s, accId: null }, true); pruneAcc(); },
  'unpair-acc'(el) { S.servizi.filter(s => s.accId === el.dataset.id).forEach(s => put('servizi', { ...s, accId: null }, true)); del('accoppiamenti', el.dataset.id, true); recompute(); render(); toast('Accoppiamento sciolto: i servizi sono di nuovo da accoppiare.'); },
  'svc-preset'(el) { const i = document.getElementById('f-servizio'); i.value = el.dataset.v; const vb = document.getElementById('volobox'); vb.hidden = !isFcoHtl(i.value); if (!vb.hidden) document.getElementById('f-volo').focus(); else i.focus(); },
  'bk-export'() { const o = { app: 'fleetline', quando: new Date().toISOString(), settings: S.settings }; COLLS.forEach(k => { o[k] = S[k]; }); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' })); a.download = `fleetline-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); },
  'import-hotel'() {
    const t = document.getElementById('imp-hotel'), known = new Set([...hotelMap().keys()].map(x => x.toLowerCase())); let n = 0, up = 0;
    for (const line of t.value.split(/\r?\n/)) {
      const [nome, ...r] = line.split(/\t|;/).map(x => x.trim()); if (!nome) continue;
      const ind = r.filter(Boolean).join(', '), ex = S.hotel.find(h => h.nome.toLowerCase() === nome.toLowerCase());
      if (ex) { if (ind && ind !== ex.indirizzo) { put('hotel', { ...ex, indirizzo: ind }, true); up++; } continue; }
      put('hotel', { id: newId('h_'), nome, indirizzo: ind }, true); known.add(nome.toLowerCase()); n++;
    }
    t.value = ''; toast(`${n} hotel aggiunti${up ? `, ${up} aggiornati` : ''}.`); render();
  },
  'del-hotel'(el) { del('hotel', el.dataset.id, true); render(); },
  'new-r'(el) { openRisorsa(el.dataset.kind, null); },
  'edit-r'(el) { openRisorsa(el.dataset.kind, el.dataset.id); },
  'save-r'(el) { saveRisorsa(el.dataset.kind, el.dataset.id || null); },
  'del-r'(el) {
    armDelete(el, () => {
      const f = el.dataset.kind === 'pullman' ? 'busId' : 'driverId';
      S.accoppiamenti.filter(a => a[f] === el.dataset.id).forEach(a => put('accoppiamenti', { ...a, [f]: null }, true));
      del(el.dataset.kind, el.dataset.id, true); closeDrawer(); recompute(); render();
      toast('Eliminato. Gli accoppiamenti che lo usavano sono tornati da assegnare.');
    });
  },
  'rv-move'(el) { S.rv.from = numDay(dayNum(S.rv.from) + Number(el.dataset.d)); render(); },
  'rv-today'() { S.rv.from = todayStr(); render(); },
  'del-examples'() {
    S.accoppiamenti.filter(a => accSvcs(a.id).every(s => s.esempio)).forEach(a => del('accoppiamenti', a.id, true));
    for (const c of ['servizi', 'pullman', 'autisti']) S[c].filter(x => x.esempio).forEach(x => del(c, x.id, true));
    pruneAcc(); toast('Dati di esempio eliminati.');
  },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el || !ACTIONS[el.dataset.action]) return; ACTIONS[el.dataset.action](el, e); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.filter) { S[t.dataset.fs || 'f'][t.dataset.filter] = t.value; render(); } });
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset && t.dataset.change; if (!c) return;
  if (c === 'bk-import') { const fl = t.files && t.files[0]; if (!fl) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || !Array.isArray(o.servizi)) throw 0; { COLLS.forEach(k => { S[k] = Array.isArray(o[k]) ? o[k] : []; }); S.settings = o.settings || {}; saveLocalAll(); recompute(); render(); } } catch (x) { alert_('File non valido: non è un backup di Track Desk.'); } }; r.readAsText(fl); t.value = ''; return; }
  if (c === 'autoredo') { S.auto.redo = t.checked; render(); return; }
  if (c === 'settingflag') { saveSettings({ [t.dataset.k]: t.checked ? 1 : 0 }); return; }
  if (c === 'accset') { setAcc(t.dataset.svc, t.value); return; }
  if (c === 'showpast') { S.showPast = t.checked; render(); }
  if (c === 'rvfrom' && t.value) { S.rv.from = t.value; render(); }
  if (c === 'rvn') { S.rv.n = parseInt(t.value, 10) || 14; render(); }
  if (c === 'setting') { const n = parseFloat(t.value); if (!isNaN(n) && n >= 0) saveSettings({ [t.dataset.k]: n }); }
});
document.addEventListener('click', e => { if (POP && !POP.el.contains(e.target) && !e.target.closest('[data-action=pick-res]')) closePop(); }, true);
window.addEventListener('scroll', e => { if (POP && !POP.el.contains(e.target)) closePop(); }, true);
window.addEventListener('resize', closePop);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && POP) { closePop(); return; }
  if (e.key === 'Escape' && !$drawer.hidden) closeDrawer();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !$drawer.hidden) { const b = $dfoot.querySelector('.btn.primary'); if (b) b.click(); }
});

const alert_ = m => { const d = document.createElement('div'); d.setAttribute('role', 'alert'); d.textContent = m; d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0E1A33;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:13px'; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); };
/* ---------- avvio ---------- */
(async function boot() {
  render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) { DB = db; S.mode = 'db'; subscribe(); }
  else { S.mode = 'local'; loadLocal(); try { if (!localStorage.getItem('gsp-v2') && !localStorage.getItem('gsp-seeded')) { COLLS.forEach(k => { S[k] = JSON.parse(JSON.stringify(SAMPLE[k] || [])); }); saveLocalAll(); localStorage.setItem('gsp-seeded', '1'); } } catch (e) {} S.ready = true; recompute(); render(); }
})();
</script>
